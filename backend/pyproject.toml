[project]
name = "ago-it-insights"
version = "0.1.0"
description = "Extracts and consolidates IT-control observations from AGO annual reports"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
